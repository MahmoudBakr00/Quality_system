<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="متابعة العيوب" />
<link rel="apple-touch-icon" href="icon-180.png" />
<meta name="theme-color" content="#3b82f6" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>فحص المطابقة المتكامل - نظام تسجيل العيوب</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
body { background: #0f172a; padding: 20px; color: #f1f5f9; min-height: 100vh; }
.container { max-width: 700px; margin: 0 auto; }
.sub-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #1e293b; padding: 14px 20px; border-radius: 12px; }
.back-link { color: #93c5fd; text-decoration: none; font-weight: 600; font-size: 14px; }
.back-link:hover { text-decoration: underline; }

.view { background: #1e293b; border-radius: 16px; padding: 28px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); margin-bottom: 20px; }
.view h1 { text-align: center; color: #60a5fa; margin-bottom: 24px; font-size: 22px; }

label { color: #cbd5e1; display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
select, input[type="text"] { width: 100%; padding: 12px 14px; margin-bottom: 18px; border: none; border-radius: 8px; background: #334155; color: #f1f5f9; font-size: 15px; }
select:focus, input:focus { outline: 2px solid #3b82f6; }

.scan-row { display: flex; gap: 10px; margin-bottom: 8px; }
.scan-row input { flex: 1; margin-bottom: 0; }
.scan-btn { border: none; padding: 0 18px; border-radius: 8px; cursor: pointer; font-weight: bold; white-space: nowrap; color: white; font-size: 14px; }
.scan-btn.serial { background: #8b5cf6; }
.scan-btn.serial:hover { background: #7c3aed; }
.scan-btn.qr { background: #06b6d4; }
.scan-btn.qr:hover { background: #0891b2; }

.extract-preview { background: #0f172a; border-radius: 8px; padding: 10px 14px; margin: -10px 0 18px; display: none; }
.extract-preview .title { color: #94a3b8; font-size: 11px; margin-bottom: 4px; }
.extract-preview .value { color: #fbbf24; font-size: 13px; font-weight: bold; font-family: monospace; direction: ltr; text-align: right; }

.btn-check { width: 100%; padding: 16px; background: #3b82f6; color: white; border: none; border-radius: 12px; font-size: 20px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: all 0.2s; }
.btn-check:hover { background: #2563eb; transform: translateY(-2px); }
.btn-check:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* شاشة النتيجة الكاملة */
.result-overlay { display: none; position: fixed; inset: 0; z-index: 200; align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 20px; animation: fadeIn 0.3s ease; }
.result-overlay.show { display: flex; }
.result-overlay.ok { background: linear-gradient(135deg, #16a34a 0%, #22c55e 100%); }
.result-overlay.ng { background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%); }
.result-overlay.undefined { background: linear-gradient(135deg, #d97706 0%, #fbbf24 100%); }
.result-overlay.scrap { background: linear-gradient(135deg, #0f0f0f 0%, #3f0d0d 100%); }
.result-overlay.pending_defect { background: linear-gradient(135deg, #581c87 0%, #a855f7 100%); }
.register-missing-btn { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.4); padding: 10px 20px; border-radius: 50px; font-size: 13px; font-weight: bold; cursor: pointer; margin-top: 10px; }
.register-missing-btn:hover { background: rgba(255,255,255,0.25); }
@keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
.result-overlay .result-icon { font-size: 6rem; margin-bottom: 16px; animation: bounceIn 0.5s ease; }
@keyframes bounceIn { 0% { transform: scale(0); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
.result-overlay .result-text { font-size: 3rem; font-weight: bold; color: white; margin-bottom: 12px; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
.result-overlay .result-sub { color: rgba(255,255,255,0.9); font-size: 16px; margin-bottom: 24px; }
.result-overlay .result-detail { background: rgba(0,0,0,0.2); border-radius: 12px; padding: 16px 20px; margin-bottom: 24px; max-width: 90%; direction: ltr; text-align: right; }
.result-overlay .result-detail .detail-row { display: flex; justify-content: space-between; gap: 20px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 13px; }
.result-overlay .result-detail .detail-row:last-child { border-bottom: none; }
.result-overlay .result-detail .detail-label { color: rgba(255,255,255,0.7); }
.result-overlay .result-detail .detail-value { color: white; font-weight: bold; font-family: monospace; }
.result-overlay .result-detail .detail-value.match { color: #86efac; }
.result-overlay .result-detail .detail-value.mismatch { color: #fca5a5; }
.result-overlay button { background: white; color: #333; border: none; padding: 14px 40px; border-radius: 50px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: all 0.2s; }
.result-overlay button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }

/* تناسب أفضل مع شاشات الموبايل الصغيرة */
@media (max-width: 480px) {
  body { padding: 12px; }
  .result-overlay .result-icon { font-size: 4rem; margin-bottom: 10px; }
  .result-overlay .result-text { font-size: 2.2rem; margin-bottom: 8px; }
  .result-overlay .result-sub { font-size: 13px; margin-bottom: 16px; }
  .result-overlay .result-detail { padding: 12px 14px; margin-bottom: 16px; }
  .result-overlay .result-detail .detail-row { font-size: 12px; gap: 10px; }
  .result-overlay button { padding: 12px 30px; font-size: 16px; }
  .btn-check { font-size: 17px; padding: 14px; }
  .view { padding: 18px; }
}

/* Scanner Modal */
#scannerModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; }
#scannerModal.open { display: flex; }
.scanner-box { background: #1e293b; border-radius: 16px; padding: 24px; width: 90%; max-width: 420px; }
.scanner-box h3 { color: #60a5fa; margin-bottom: 16px; text-align: center; font-size: 16px; }
#scannerContainer { width: 100%; border-radius: 12px; overflow: hidden; }
.scanner-close { width: 100%; margin-top: 16px; padding: 12px; background: #64748b; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; }
.scanner-close:hover { background: #475569; }

/* Conditions Preview */
.conditions-preview { background: #0f172a; border-radius: 10px; padding: 14px; margin-bottom: 18px; display: none; }
.conditions-preview h4 { color: #60a5fa; font-size: 13px; margin-bottom: 10px; }
.condition-chip { display: inline-flex; align-items: center; gap: 6px; background: #334155; padding: 6px 12px; border-radius: 20px; font-size: 12px; margin: 3px; }
.condition-chip .chip-type { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
.condition-chip .chip-type.peer { background: #8b5cf6; color: white; }
.condition-chip .chip-type.db { background: #06b6d4; color: white; }

/* Recent Logs */
.recent-log { background: #1e293b; border-radius: 14px; padding: 20px; }
.recent-log h3 { color: #60a5fa; font-size: 15px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.log-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #334155; font-size: 12px; }
.log-row:last-child { border-bottom: none; }
.log-row .log-info { flex: 1; }
.log-row .log-station { color: #94a3b8; font-size: 11px; }
.log-row .log-serial { color: #f1f5f9; font-family: monospace; font-size: 12px; margin-top: 2px; direction: ltr; text-align: right; }
.log-badge { padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 11px; white-space: nowrap; }
.log-badge.ok { background: #22c55e; color: white; }
.log-badge.ng { background: #ef4444; color: white; }
.log-badge.undefined { background: #fbbf24; color: #78350f; }

/* Condition Results Table */
.condition-results { width: 100%; margin-top: 12px; border-collapse: collapse; font-size: 12px; }
.condition-results th { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8); padding: 8px; text-align: right; }
.condition-results td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); }
.condition-results .cond-match { color: #86efac; }
.condition-results .cond-mismatch { color: #fca5a5; font-weight: bold; }
.condition-results .cond-undefined { color: #fcd34d; }

/* Stats bar */
.stats-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.stat-card { flex: 1; min-width: 100px; background: #1e293b; border-radius: 10px; padding: 12px; text-align: center; }
.stat-card .stat-number { font-size: 24px; font-weight: bold; color: #60a5fa; }
.stat-card .stat-label { font-size: 11px; color: #94a3b8; margin-top: 4px; }

.empty-state { text-align: center; padding: 40px; color: #64748b; }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="container">
  <div class="sub-header">
    <a href="home.html" class="back-link">⬅ الرئيسية</a>
    <div style="display:flex; align-items:center; gap:10px;">
      <div id="langToggleWrap"></div>
      <span id="userEmail" style="color:#94a3b8; font-size:13px;"></span>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-number" id="statTotal">0</div>
      <div class="stat-label">إجمالي الفحوصات</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="statOk" style="color:#22c55e;">0</div>
      <div class="stat-label">مطابق</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="statNg" style="color:#ef4444;">0</div>
      <div class="stat-label">غير مطابق</div>
    </div>
  </div>

  <div class="view">
    <h1>🔍 فحص المطابقة المتكامل</h1>

    <label>🏭 محطة الفحص</label>
    <select id="stationSelect" required>
      <option value="">⏳ جاري تحميل المحطات...</option>
    </select>

    <!-- عرض الشروط المفعلة -->
    <div class="conditions-preview" id="conditionsPreview">
      <h4>📋 الشروط المفعلة:</h4>
      <div id="conditionsChips"></div>
    </div>

    <label>📷 سكان</label>
    <div class="scan-row">
      <input type="text" id="unifiedScanInput" placeholder="اسكان الكود أو اكتبه واضغط Enter" autocomplete="off" />
      <button type="button" class="scan-btn serial" id="openCameraScannerBtn">📷 كاميرا</button>
    </div>
    <div id="scanProgressWrap" style="display:none; margin: -10px 0 18px;">
      <div style="color:#94a3b8; font-size:12px; margin-bottom:6px;" id="scanProgressLabel"></div>
      <div id="scanBufferChips" style="display:flex; flex-wrap:wrap; gap:6px;"></div>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button type="button" id="finishScanNowBtn" style="background:#22c55e; color:white; border:none; padding:6px 14px; border-radius:6px; font-size:12px; cursor:pointer;">✅ تنفيذ الفحص بالأكواد دي</button>
        <button type="button" id="resetScanBtn" style="background:#64748b; color:white; border:none; padding:6px 14px; border-radius:6px; font-size:12px; cursor:pointer;">🗑 إلغاء ومسح من جديد</button>
      </div>
    </div>
  </div>

  <!-- Recent Logs -->
  <div class="recent-log">
    <h3>📋 آخر عمليات الفحص <span style="color:#64748b; font-size:12px; font-weight:normal;">(اليوم)</span></h3>
    <div id="recentLogList">
      <div class="empty-state">
        <div class="icon">📭</div>
        <div>لا توجد عمليات فحص بعد</div>
      </div>
    </div>
  </div>
</div>

<!-- Scanner Modal -->
<div id="scannerModal">
  <div class="scanner-box">
    <h3 id="scannerTitle">📷 وجّه الكاميرا</h3>
    <div id="scannerContainer"></div>
    <button class="scanner-close" id="closeScannerBtn">إغلاق</button>
  </div>
</div>

<!-- Result Overlay -->
<div class="result-overlay" id="resultOverlay">
  <div class="result-icon" id="resultIcon">✔</div>
  <div class="result-text" id="resultText">OK</div>
  <div class="result-sub" id="resultSub">جميع الشروط مطابقة</div>
  <div class="result-detail" id="resultDetail"></div>
  <div id="registerMissingWrap" style="display:none;">
    <button class="register-missing-btn" id="registerMissingBtn">➕ سجّل القيمة دي كموديل صحيح جديد</button>
  </div>
  <button id="resultCloseBtn">✓ موافق — فحص جديد</button>
</div>

<script src="shared.js"></script>
<script>
let currentUser = null;
let currentScanner = null;
let currentStation = null;
let currentConditions = [];
let todayStats = { total: 0, ok: 0, ng: 0 };
let isFullAccessUser = false;

// =========================================================
// Initialization
// =========================================================
async function init() {
  applyTranslations();
  renderLangToggle('langToggleWrap');
  const auth = await requireAuth();
  if (!auth) return;
  currentUser = auth.user;
  isFullAccessUser = auth.role === 'admin' || auth.role === 'general_supervisor';
  document.getElementById('userEmail').textContent = auth.user.email;

  await loadStations();
  loadTodayStats();
  loadRecentLogs();

  // Auto-focus on the single scan field
  document.getElementById('unifiedScanInput').focus();
}
init();

// فتح إذن تشغيل الصوت من أول تفاعل حقيقي للمستخدم مع الصفحة (متطلب من المتصفحات)
document.addEventListener('click', () => getAudioCtx(), { once: true });
document.addEventListener('keydown', () => getAudioCtx(), { once: true });

let allStationsData = [];

// =========================================================
// Load Stations
// =========================================================
async function loadStations() {
  const select = document.getElementById('stationSelect');

  try {
    const { data, error } = await sbClient
      .from('comparison_stations')
      .select('*')
      .order('name');

    if (error) throw error;
    allStationsData = data || [];

    if (!data || data.length === 0) {
      select.innerHTML = '<option value="">📭 لا توجد محطات مضافة</option>';
      return;
    }

    select.innerHTML = '<option value="">-- اختر محطة الفحص --</option>';
    data.forEach(s => {
      const o = document.createElement('option');
      o.value = s.id;
      o.textContent = s.name;
      select.appendChild(o);
    });
  } catch (err) {
    console.error('فشل تحميل المحطات:', err);
    select.innerHTML = '<option value="">❌ فشل التحميل</option>';
  }
}

// =========================================================
// Scan buffer: كل كود بيتضاف هنا لحد ما نوصل لعدد الأكواد المطلوب للمحطة
// =========================================================
let scanBuffer = [];

function resetScanBuffer() {
  scanBuffer = [];
  renderScanProgress();
  document.getElementById('unifiedScanInput').value = '';
  document.getElementById('unifiedScanInput').focus();
}

function renderScanProgress() {
  const wrap = document.getElementById('scanProgressWrap');
  const label = document.getElementById('scanProgressLabel');
  const chips = document.getElementById('scanBufferChips');
  const finishBtn = document.getElementById('finishScanNowBtn');
  const expected = currentStation ? (currentStation.scansPerUnit || 1) : 1;

  if (!currentStation || scanBuffer.length === 0) {
    wrap.style.display = 'none';
    return;
  }

  wrap.style.display = 'block';
  if (scanBuffer.length < expected) {
    label.textContent = `⏳ تم سكان ${scanBuffer.length} من ${expected} أكواد مطلوبة — كمّل السكان أو دوس "تنفيذ الفحص" لو خلصت`;
  } else {
    label.textContent = `✅ تم سكان العدد المطلوب (${expected}) — جاري التنفيذ...`;
  }
  chips.innerHTML = scanBuffer.map((code, i) => `
    <span class="condition-chip" style="direction:ltr;">${i + 1}. ${code}</span>
  `).join('');
  // زرار التنفيذ اليدوي يفيد لو عايز يوقف قبل ما يوصل للعدد المتوقع، أو يزود العدد المتوقع محتاج له
  finishBtn.style.display = scanBuffer.length < expected ? 'inline-block' : 'none';
}

document.getElementById('resetScanBtn').addEventListener('click', resetScanBuffer);
document.getElementById('finishScanNowBtn').addEventListener('click', () => {
  if (scanBuffer.length === 0) return;
  runComparison();
});

async function handleScan(rawValue) {
  const value = (rawValue || '').trim();
  if (!value) return;

  if (!currentStation) { alert('⚠️ اختر محطة الفحص أولاً'); return; }

  scanBuffer.push(value);
  document.getElementById('unifiedScanInput').value = '';
  renderScanProgress();

  const expected = currentStation.scansPerUnit || 1;
  if (scanBuffer.length >= expected) {
    // مهلة قصيرة (نص ثانية) قبل تنفيذ الفحص فعليًا - فرصة أخيرة لو محتاج تلغي أو تضيف كود كمان
    document.getElementById('unifiedScanInput').focus();
    setTimeout(() => { if (scanBuffer.length >= expected) runComparison(); }, 400);
  } else {
    document.getElementById('unifiedScanInput').focus();
  }
}

document.getElementById('unifiedScanInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    handleScan(e.target.value);
  }
});

// =========================================================
// Load Conditions when station changes
// =========================================================
document.getElementById('stationSelect').addEventListener('change', async (e) => {
  const stationId = e.target.value;
  const preview = document.getElementById('conditionsPreview');
  const chips = document.getElementById('conditionsChips');

  resetScanBuffer();

  if (!stationId) {
    preview.style.display = 'none';
    currentConditions = [];
    currentStation = null;
    renderScanProgress();
    return;
  }

  const stationRow = allStationsData.find(s => s.id === stationId);
  currentStation = {
    id: stationId,
    name: stationRow ? stationRow.name : e.target.selectedOptions[0].textContent,
    scansPerUnit: stationRow ? (stationRow.scans_per_unit || 1) : 1
  };
  renderScanProgress();

  try {
    const { data, error } = await sbClient
      .from('comparison_conditions')
      .select('*')
      .eq('station_id', stationId)
      .order('order_index');

    if (error) throw error;
    currentConditions = data || [];

    if (currentConditions.length === 0) {
      chips.innerHTML = '<span style="color:#fbbf24; font-size:12px;">⚠️ لا توجد شروط مضافة لهذه المحطة</span>';
      preview.style.display = 'block';
      return;
    }

    chips.innerHTML = currentConditions.map(c => `
      <span class="condition-chip">
        <span class="chip-type ${c.comparison_type === 'peer' ? 'peer' : 'db'}">${c.comparison_type === 'peer' ? '🔗' : '📊'}</span>
        ${c.order_index}. ${c.name}
        ${c.extract_start ? `<span style="color:#94a3b8;">(${c.extract_start}-${c.extract_end})</span>` : ''}
        ${c.comparison_type === 'peer' ? `<span style="color:#a78bfa;">← شرط #${c.peer_condition_order}</span>` : ''}
      </span>
    `).join('');

    preview.style.display = 'block';

  } catch (err) {
    console.error('فشل تحميل الشروط:', err);
    chips.innerHTML = '<span style="color:#ef4444;">❌ فشل تحميل الشروط</span>';
    preview.style.display = 'block';
  }
});

// =========================================================
// Extract helper
// =========================================================
function extractSubstring(str, start, end) {
  if (!str || !start || !end) return null;
  // 1-based to 0-based indexing
  return str.substring(start - 1, end);
}

// =========================================================
// صوت تنبيه عند وجود مشكلة (NG/سكراب/معلق/غير موجود) - عشان يلفت
// الانتباه حتى لو الفني مش شايف الشاشة في اللحظة دي. صوت OK هادئ ومختلف
// =========================================================
let audioCtxInstance = null;
function getAudioCtx() {
  if (!audioCtxInstance) {
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtxInstance = new AC();
  }
  if (audioCtxInstance.state === 'suspended') audioCtxInstance.resume();
  return audioCtxInstance;
}

function beep(freq, durationMs, delayMs, volume) {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.value = volume || 0.15;
    osc.connect(gain);
    gain.connect(ctx.destination);
    const startAt = ctx.currentTime + (delayMs || 0) / 1000;
    osc.start(startAt);
    osc.stop(startAt + durationMs / 1000);
  } catch (err) {
    console.warn('تعذّر تشغيل الصوت:', err);
  }
}

function playAlertSound(state) {
  if (state === 'ok') {
    beep(880, 150, 0, 0.12); // نغمة قصيرة هادئة
  } else if (state === 'scrap' || state === 'pending_defect') {
    // نغمة تحذير مستمرة: 3 صفارات متتالية
    beep(440, 200, 0, 0.2);
    beep(440, 200, 300, 0.2);
    beep(440, 200, 600, 0.2);
  } else {
    // ng / undefined: صفارتين
    beep(523, 180, 0, 0.18);
    beep(523, 180, 250, 0.18);
  }
}

// =========================================================
// فحص حالة العيوب المسجلة على السيريال ده (منفصل عن نتيجة شروط المقارنة)
// بيرجع: 'scrap' لو فيه عيب اتقرر سكراب، 'pending' لو فيه عيب لسه معلق
// (لم يُتخذ قرار)، أو null لو مفيش عيوب أو كلها اتاخد فيها قرار (إصلاح/موافقة بعلم/تغيير...)
// =========================================================
async function checkDefectStatus(serial) {
  try {
    const { data, error } = await sbClient
      .from('defects')
      .select('status, action_taken')
      .eq('serial_number', serial);

    if (error || !data || data.length === 0) return null;

    if (data.some(d => d.status === 'rejected' && d.action_taken === 'scrap')) return 'scrap';
    if (data.some(d => d.status === 'pending')) return 'pending';
    return null;
  } catch (err) {
    console.warn('فشل فحص حالة العيوب:', err);
    return null;
  }
}

// =========================================================
// Scanner Logic (زرار كاميرا واحد، بيغذي نفس خانة السكان الموحدة)
// =========================================================
const scannerModal = document.getElementById('scannerModal');

function openScanner() {
  document.getElementById('scannerTitle').textContent = '📷 وجّه الكاميرا نحو الكود';
  scannerModal.classList.add('open');

  currentScanner = startCombinedScanner('scannerContainer', (decodedText) => {
    closeScannerModal();
    handleScan(decodedText);
  }, (err) => console.error('Scanner error:', err));
}

document.getElementById('openCameraScannerBtn').addEventListener('click', openScanner);

async function closeScannerModal() {
  scannerModal.classList.remove('open');
  if (currentScanner) {
    await currentScanner.stop();
    currentScanner = null;
  }
}
document.getElementById('closeScannerBtn').addEventListener('click', closeScannerModal);

// =========================================================
// Main Comparison Logic
// النظام بياخد كل الأكواد اللي اتسكانت للوحدة دي، وبيجرب لكل شرط
// أنهي كود من دول (كامل أو بعد الاستخراج) بيحقق الشرط - من غير ما
// الفني يحدد هو نفسه "ده سيريال" أو "ده QR"
// =========================================================
let comparisonInProgress = false;
async function runComparison() {
  if (comparisonInProgress) return;
  if (!currentStation) { resetScanBuffer(); return; }
  if (scanBuffer.length === 0) return;
  comparisonInProgress = true;
  const stationId = currentStation.id;
  const codes = [...scanBuffer];

  if (currentConditions.length === 0) {
    alert('⚠️ لا توجد شروط مضافة لهذه المحطة');
    comparisonInProgress = false;
    resetScanBuffer();
    return;
  }

  document.getElementById('unifiedScanInput').disabled = true;

  try {
    const { data: allRefRows } = await sbClient
      .from('comparison_reference_data')
      .select('*')
      .eq('station_id', stationId);

    const conditionResults = [];
    const scannedValues = {};
    let overallResult = 'ok';
    let mismatchDetails = [];

    // كل عنصر: {idx: رقم الكود في مصفوفة الأكواد, value: القيمة (مستخرجة أو كاملة)}
    // claimedBy[idx] = رقم ترتيب الشرط اللي "أخد" الكود ده بنجاح (عشان شرط تاني ميستخدمهوش
    // كقيمة عرض تلقائية لو هو فشل، ويوريك الكود الحقيقي المتبقي بدل ما يكرر نفس الكود المتاخد)
    const claimedBy = new Array(codes.length).fill(null);

    const buildAttempts = (condition) => codes.map((code, idx) => ({
      idx,
      value: condition.extract_start ? extractSubstring(code, condition.extract_start, condition.extract_end) : code
    }));

    const findDbMatch = (condition, attempts, onlyUnclaimed) => {
      for (const a of attempts) {
        if (!a.value) continue;
        if (onlyUnclaimed && claimedBy[a.idx] !== null) continue;
        const found = (allRefRows || []).find(r => String(r.expected_values?.[condition.order_index]) === String(a.value));
        if (found) return { attempt: a, found };
      }
      return null;
    };

    // Pass 1: مطابقة الشروط اللي عندها قيمة حقيقية في القاعدة، بالأولوية للأكواد اللي لسه محدش
    // أخدها (عشان نمنع كودين شروط مختلفين ياخدوا نفس الكود غلط لو فيه اختيار تاني متاح)
    for (const condition of currentConditions) {
      if (condition.comparison_type !== 'database') continue;
      const attempts = buildAttempts(condition);
      const result = findDbMatch(condition, attempts, true) || findDbMatch(condition, attempts, false);
      if (result && claimedBy[result.attempt.idx] === null) claimedBy[result.attempt.idx] = condition.order_index;
    }

    for (const condition of currentConditions) {
      const attempts = buildAttempts(condition);

      let match = false;
      let matchedValue = null;
      let expectedValue = null;
      let detail = '';

      if (condition.comparison_type === 'peer') {
        const peerCondition = currentConditions.find(c => c.order_index === condition.peer_condition_order);
        outer:
        for (const code1 of codes) {
          const v1 = condition.extract_start ? extractSubstring(code1, condition.extract_start, condition.extract_end) : code1;
          if (!v1) continue;
          for (const code2 of codes) {
            const v2 = peerCondition && peerCondition.extract_start ? extractSubstring(code2, peerCondition.extract_start, peerCondition.extract_end) : code2;
            if (v2 && v1 === v2) { match = true; matchedValue = v1; expectedValue = v2; break outer; }
          }
        }
        if (!match) matchedValue = (attempts.find(a => a.value && claimedBy[a.idx] === null) || attempts.find(a => a.value) || {}).value || null;
        detail = match ? 'مطابق' : 'لم يتم إيجاد تطابق بين الأكواد المسكونة';
        if (!match) { overallResult = 'ng'; mismatchDetails.push(`${condition.name}: عدم تطابق`); }

      } else if (condition.comparison_type === 'database') {
        const result = findDbMatch(condition, attempts, false);
        if (result && claimedBy[result.attempt.idx] === condition.order_index) {
          match = true;
          matchedValue = result.attempt.value;
          expectedValue = result.found.expected_values[condition.order_index];
        } else {
          // فشل: نفضّل نوري كود مش متاخد لشرط تاني بالفعل، عشان النتيجة تكون واضحة ومفيدة
          const unclaimed = attempts.find(a => a.value && claimedBy[a.idx] === null);
          matchedValue = (unclaimed || attempts.find(a => a.value) || {}).value || null;
        }
        detail = match ? 'موجود في قاعدة البيانات' : 'غير موجود في القاعدة المرجعية';
        if (!match) { overallResult = 'ng'; mismatchDetails.push(`${condition.name}: ${matchedValue || 'N/A'} غير موجود في DB`); }
      }

      scannedValues[condition.order_index] = matchedValue;
      conditionResults.push({
        condition_id: condition.id,
        condition_name: condition.name,
        order_index: condition.order_index,
        extracted_value: matchedValue,
        expected_value: expectedValue,
        comparison_type: condition.comparison_type,
        match: match,
        detail: detail
      });
    }

    // فحص حالة العيوب: بنجرب كل كود اتسكان (مش لازم نعرف مسبقًا أنهي كود هو السيريال)
    let defectFlag = null;
    for (const code of codes) {
      const flag = await checkDefectStatus(code);
      if (flag === 'scrap') { defectFlag = 'scrap'; break; }
      if (flag === 'pending') defectFlag = 'pending';
    }

    // Save log (بنحتفظ بالأكواد الخام كمان تحت مفتاح _raw عشان المراجعة لاحقًا)
    const logPayload = {
      station_id: stationId,
      station_name: currentStation.name,
      scanned_values: { ...scannedValues, _raw: codes },
      result: overallResult,
      defect_flag: defectFlag,
      mismatch_details: mismatchDetails.join('; '),
      condition_results: conditionResults,
      performed_by: currentUser.id,
      performed_by_email: currentUser.email
    };

    const { error: logError } = await sbClient
      .from('comparison_logs')
      .insert([logPayload]);

    if (logError) {
      console.warn('فشل حفظ السجل:', logError);
    }

    // Show result (النتيجة النهائية بتاخد بالها من حالة العيب كمان، أولوية: سكراب > NG > غير موجود > معلق > OK)
    showResult(overallResult, conditionResults, codes, defectFlag);

    // Update stats
    updateStats(overallResult);

    // Refresh logs
    loadRecentLogs();

  } catch (err) {
    console.error('خطأ في الفحص:', err);
    alert('❌ حدث خطأ أثناء الفحص: ' + err.message);
  } finally {
    document.getElementById('unifiedScanInput').disabled = false;
    scanBuffer = [];
    renderScanProgress();
    comparisonInProgress = false;
  }
}

// =========================================================
// Show Result Overlay
// =========================================================
function showResult(result, conditionResults, codes, defectFlag) {
  const overlay = document.getElementById('resultOverlay');
  const icon = document.getElementById('resultIcon');
  const text = document.getElementById('resultText');
  const sub = document.getElementById('resultSub');
  const detail = document.getElementById('resultDetail');

  // الأولوية في العرض: سكراب > NG (شامل "غير موجود في قاعدة البيانات") > معلق (لسه من غير قرار) > OK
  // ملحوظة: النتيجة دي دايمًا حية (بتتحسب من جديد كل سكان) - لو المشكلة لسه موجودة هتفضل تظهر
  // لحد ما حد يعدّل الحالة من نظام تسجيل العيوب أو يضيف القيمة الناقصة في القاعدة المرجعية
  let displayState = result;
  if (defectFlag === 'scrap') displayState = 'scrap';
  else if (result === 'ok' && defectFlag === 'pending') displayState = 'pending_defect';

  overlay.className = 'result-overlay show ' + displayState;
  playAlertSound(displayState);

  if (displayState === 'scrap') {
    icon.textContent = '💀';
    text.textContent = 'سكراب';
    sub.textContent = '🚫 الوحدة دي مقرر إنها سكراب — لازم تتحول ولا تكمل على الخط';
  } else if (displayState === 'ng') {
    icon.textContent = '✘';
    text.textContent = 'NG';
    const failedNames = conditionResults.filter(cr => !cr.match).map(cr => cr.condition_name);
    sub.textContent = failedNames.length > 0 ? '❌ المشكلة في: ' + failedNames.join('، ') : '❌ يوجد عدم مطابقة';
  } else if (displayState === 'undefined') {
    icon.textContent = '⚠';
    text.textContent = 'غير محدد';
    sub.textContent = '⚠️ لا توجد شروط مفعلة';
  } else if (displayState === 'pending_defect') {
    icon.textContent = '⏳';
    text.textContent = 'لم يتم الإصلاح';
    sub.textContent = '⚠️ فيه عيب مسجل على الوحدة دي ولسه معلق (لم يُتخذ قرار)';
  } else {
    icon.textContent = '✔';
    text.textContent = 'OK';
    sub.textContent = '✅ جميع الشروط مطابقة — المنتج سليم';
  }

  // زرار تسجيل موديل ناقص من قاعدة البيانات المرجعية - للأدمن/المشرف العام بس، ولو فيه شرط مش موجود فعلاً
  const missingConditions = conditionResults.filter(cr => cr.comparison_type === 'database' && !cr.match);
  const registerBtnWrap = document.getElementById('registerMissingWrap');
  if (isFullAccessUser && missingConditions.length > 0 && displayState === 'ng') {
    registerBtnWrap.style.display = 'block';
    registerBtnWrap.dataset.missing = JSON.stringify(missingConditions.map(cr => ({ order_index: cr.order_index, value: cr.extracted_value })));
  } else {
    registerBtnWrap.style.display = 'none';
  }

  // بدل الجدول الكامل بكل الشروط، بنوري بس المشكلة الفعلية (الشروط اللي فشلت) بشكل مباشر وواضح
  const failedConditions = conditionResults.filter(cr => !cr.match);
  let detailHtml = '';

  if (displayState === 'ng' && failedConditions.length > 0) {
    detailHtml += failedConditions.map(cr => {
      const reason = cr.comparison_type === 'peer'
        ? 'مش متطابق مع الشرط المرتبط بيه'
        : 'مش موجودة في القاعدة المرجعية';
      return `
        <div class="detail-row">
          <span class="detail-label">${cr.condition_name}:</span>
          <span class="detail-value mismatch" style="direction:ltr;">"${cr.extracted_value || 'N/A'}" ${reason}</span>
        </div>
      `;
    }).join('');
  }

  if (defectFlag) {
    detailHtml += `
      <div class="detail-row">
        <span class="detail-label">حالة العيوب المسجلة:</span>
        <span class="detail-value ${defectFlag === 'scrap' ? 'mismatch' : ''}">${defectFlag === 'scrap' ? '🗑 سكراب' : '⏳ معلق (لم يُتخذ قرار)'}</span>
      </div>
    `;
  }

  detail.innerHTML = detailHtml;
  detail.style.display = detailHtml ? 'block' : 'none';
}

document.getElementById('resultCloseBtn').addEventListener('click', () => {
  document.getElementById('resultOverlay').classList.remove('show');
  document.getElementById('registerMissingWrap').style.display = 'none';
  resetScanBuffer();
});

// تسجيل موديل ناقص من قاعدة البيانات المرجعية مباشرة من شاشة النتيجة (أدمن/مشرف عام بس)
document.getElementById('registerMissingBtn').addEventListener('click', async () => {
  const wrap = document.getElementById('registerMissingWrap');
  const missing = JSON.parse(wrap.dataset.missing || '[]');
  if (!currentStation || missing.length === 0) return;

  if (!confirm('هيتم تسجيل القيم دي كموديل جديد صحيح في قاعدة بيانات المحطة. متابعة؟')) return;

  const expectedValues = {};
  missing.forEach(m => { expectedValues[m.order_index] = m.value; });

  const btn = document.getElementById('registerMissingBtn');
  btn.disabled = true;
  btn.textContent = '⏳ جاري التسجيل...';

  const { error } = await sbClient.from('comparison_reference_data')
    .insert([{ station_id: currentStation.id, expected_values: expectedValues }]);

  btn.disabled = false;
  btn.textContent = '➕ سجّل القيمة دي كموديل صحيح جديد';

  if (error) { alert('❌ فشل التسجيل: ' + error.message); return; }
  alert('✅ تم تسجيل القيمة كموديل صحيح جديد — هتتقبل من دلوقتي');
  wrap.style.display = 'none';
});

// =========================================================
// Statistics
// =========================================================
async function loadTodayStats() {
  const today = new Date().toISOString().split('T')[0];

  try {
    const { data, error } = await sbClient
      .from('comparison_logs')
      .select('result')
      .eq('performed_by', currentUser.id)
      .gte('created_at', today + 'T00:00:00')
      .lte('created_at', today + 'T23:59:59');

    if (error) throw error;

    todayStats = { total: 0, ok: 0, ng: 0 };
    (data || []).forEach(log => {
      todayStats.total++;
      if (log.result === 'ok') todayStats.ok++;
      else if (log.result === 'ng') todayStats.ng++;
    });

    updateStatsDisplay();
  } catch (err) {
    console.warn('فشل تحميل الإحصائيات:', err);
  }
}

function updateStats(result) {
  todayStats.total++;
  if (result === 'ok') todayStats.ok++;
  else if (result === 'ng') todayStats.ng++;
  updateStatsDisplay();
}

function updateStatsDisplay() {
  document.getElementById('statTotal').textContent = todayStats.total;
  document.getElementById('statOk').textContent = todayStats.ok;
  document.getElementById('statNg').textContent = todayStats.ng;
}

// =========================================================
// Recent Logs
// =========================================================
async function loadRecentLogs() {
  const container = document.getElementById('recentLogList');
  const today = new Date().toISOString().split('T')[0];

  try {
    const { data, error } = await sbClient
      .from('comparison_logs')
      .select('*')
      .eq('performed_by', currentUser.id)
      .gte('created_at', today + 'T00:00:00')
      .order('created_at', { ascending: false })
      .limit(10);

    if (error) throw error;

    if (!data || data.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="icon">📭</div>
          <div>لا توجد عمليات فحص اليوم</div>
        </div>
      `;
      return;
    }

    const resultText = { ok: 'OK', ng: 'NG', undefined: 'غير محدد' };

    container.innerHTML = data.map(log => {
      const scannedVals = Object.entries(log.scanned_values || {})
        .map(([k, v]) => `${k}:"${v}"`).join(' | ');

      return `
        <div class="log-row">
          <div class="log-info">
            <div class="log-station">🏭 ${log.station_name || 'غير معروف'}</div>
            <div class="log-serial">${scannedVals}</div>
          </div>
          <span class="log-badge ${log.result}">${resultText[log.result] || log.result}</span>
        </div>
      `;
    }).join('');

  } catch (err) {
    console.warn('فشل تحميل السجل:', err);
    container.innerHTML = '<div style="color:#64748b; text-align:center; padding:20px;">📴 غير متصل</div>';
  }
}
